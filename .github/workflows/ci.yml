name: TypeScript validation
on: [push, pull_request]
jobs:
  typecheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee /tmp/hotmart-install.log
      - name: TypeScript validation
        id: build
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/hotmart-build.log
      - name: Unit tests
        id: tests
        if: steps.install.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/hotmart-tests.log
      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          cp /tmp/hotmart-*.log ci-diagnostics/ 2>/dev/null || true
          printf 'install=%s\nbuild=%s\ntests=%s\n' "${{ steps.install.outcome }}" "${{ steps.build.outcome }}" "${{ steps.tests.outcome }}" > ci-diagnostics/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotmart-ci-diagnostics
          path: ci-diagnostics/
          retention-days: 7
